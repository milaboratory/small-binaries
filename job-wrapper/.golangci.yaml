# Adapted from core/pl/.golangci.yaml. Differences: the whole module is linted on every run (no
# new-from-rev), the Go version matches this module, and the pl-only rules are dropped.
version: "2"

run:
  go: "1.24"
  allow-parallel-runners: true

linters:
  default: none

  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - godoclint
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - noinlineerr
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - sloglint
    - spancheck
    - staticcheck
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  settings:
    exhaustive:
      default-signifies-exhaustive: true

    gocognit:
      min-complexity: 20

    gosec:
      # The wrapper opens exactly the paths the job template and cgroup discovery hand it; there is
      # no untrusted input for G304 / G703 to guard against. The service files it creates are read
      # by the runner under a different uid, so directories are 0755 and files 0644 on purpose.
      excludes:
        - G304
        - G703
      config:
        G301: "0755"
        G302: "0644"
        G306: "0644"

    govet:
      # nilness: flow-sensitive nil-deref analyzer, not in govet's default set.
      enable:
        - nilness

    recvcheck:
      # Deserializers must use pointer receivers, so they are excluded from the mixed-receiver check.
      exclusions:
        - "*.UnmarshalText"
        - "*.UnmarshalJSON"
        - "*.UnmarshalYAML"
        - "*.UnmarshalXML"
        - "*.UnmarshalBinary"
        - "*.GobDecode"

  exclusions:
    rules:
      # Tests launch the compiled wrapper, docker and shell commands by construction.
      - path: "(.+)_test\\.go"
        linters:
          - gocognit
          - gosec
