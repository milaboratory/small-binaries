name: Build and Test NPM packages
on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: milaboratory/github-ci/actions/context/init@v4
        with:
          version-canonize: false
          branch-versioning: main

  # The shared node-simple-pnpm workflow below only runs package tests when it also starts a
  # Platforma backend for them (pl-start-for-tests), which nothing here needs. The Go packages
  # carry self-contained test scripts (they build their own binaries; job-wrapper also drives
  # Docker), so they run here directly, and the build/publish job waits for them.
  test:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: "**/go.sum"

      - name: Run the test script of every package that has one
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          failed=()
          for manifest in */package.json test-utils/*/package.json; do
            pkg="$(dirname "${manifest}")"
            if ! jq -e '.scripts.test // empty' "${manifest}" >/dev/null; then
              continue
            fi
            echo "::group::${pkg}"
            if (cd "${pkg}" && npm run test); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::tests failed in ${pkg}"
              failed+=("${pkg}")
            fi
          done

          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Failed packages: ${failed[*]}"
            exit 1
          fi

  run:
    needs:
      - init
      - test

    uses: milaboratory/github-ci/.github/workflows/node-simple-pnpm.yaml@v4
    with:
      app-name: Small cross-platform utils
      app-name-slug: "small-cross-platform-packages"
      node-version: "20.x"
      golang-version: "1.24"
      build-script-name: "build"

      test: true
      test-script-name: "test"
      pl-start-for-tests: false

      publish-to-public: true
      package-path: "catalogue"
      create-tag: true

      pnpm-recursive-build: false
      pnpm-recursive-tests: false
      npmrc-config: |
        {
          "registries": {
            "https://registry.npmjs.org/": {
              "scopes": ["milaboratories", "platforma-open", "platforma-sdk"],
              "tokenVar": "NPMJS_TOKEN"
            },
            "https://npm.pkg.github.com/": {
              "scopes": ["milaboratory"],
              "tokenVar": "NODE_AUTH_TOKEN"
            }
          }
        }
      env: |
        { "TURBO_CACHE_BYPASS": "1" }
    secrets:
      env: |
        { "PL_REGISTRY_PLATFORMA_OPEN_UPLOAD_URL": ${{ toJSON(secrets.PL_REGISTRY_PLOPEN_UPLOAD_URL) }},
          "QUAY_USERNAME": ${{ toJSON(secrets.QUAY_USERNAME) }},
          "QUAY_ROBOT_TOKEN": ${{ toJSON(secrets.QUAY_ROBOT_TOKEN) }},
          "NPMJS_TOKEN": ${{ toJSON(secrets.NPMJS_TOKEN) }},
          "AWS_CI_IAM_MONOREPO_SIMPLE_ROLE": ${{ toJSON(secrets.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE) }},
          "AWS_CI_TURBOREPO_S3_BUCKET": ${{ toJSON(secrets.AWS_CI_TURBOREPO_S3_BUCKET) }} }

      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ secrets.SLACK_BLOCKS_CI_CHANNEL }}

      GH_ZEN_APP_ID: ${{ secrets.GH_ZEN_APP_ID }}
      GH_ZEN_APP_PRIVATE_KEY: ${{ secrets.GH_ZEN_APP_PRIVATE_KEY }}
